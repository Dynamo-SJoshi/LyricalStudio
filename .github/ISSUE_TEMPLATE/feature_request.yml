name: Feature request
description: Suggest an idea, a new lyric layout, or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the idea, and the problem it solves if there is one.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, references (e.g. lyric videos you like), or songs to try it with.
